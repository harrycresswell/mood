{{ define "main" }}
	<h1 class="mt20">#{{ .Title | title }}</h1>
	<ul class="PostList grid">
		{{ range .Pages }}
      {{ partial "post-list-item.html" . }}
		{{ end }}
	</ul>
{{ end }}

{{ define "footer" }}
  {{ if ne .Layout "lightbox" }}
      {{- partialCached "footer.html" . -}}
  {{ end }}
{{ end }}
